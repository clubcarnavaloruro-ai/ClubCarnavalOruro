{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="{% static 'img/LogoCarnavalOruroClub.webp' %}" type="image/webp">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/componentes/navbar-inicio.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth/login.css' %}">
</head>
<body class="login-body">
    <div class="login-bg" aria-hidden="true" style="background-image: url('{% static 'img/LogoCarnavalOruroClub.webp' %}');"></div>
    <div class="login-bg-overlay" aria-hidden="true"></div>

    <nav class="navbar-inicio navbar navbar-expand-lg">
        <div class="container-fluid navbar-inicio-container">
            <div class="navbar-left">
                <a class="navbar-brand-inicio" href="{% url 'core:inicio' %}">
                    <img src="{% static 'img/LogoCarnavalOruroClub.webp' %}" alt="Club carnaval Oruro" class="navbar-logo" width="100" height="100">
                    <span class="navbar-brand-text">
                        <span class="brand-american">CLUB Carnaval</span> <span class="brand-outlet">ORURO</span>
                    </span>
                </a>
            </div>
            <div class="navbar-right-icons">
                <a href="{% url 'core:inicio' %}" class="nav-icon-btn" title="Volver al inicio" aria-label="Volver al inicio">
                    <i class="fas fa-arrow-left"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="login-shell">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-card-header">
                    <span class="login-badge">Club Carnaval Oruro</span>
                    <img class="login-logo" src="{% static 'img/LogoCarnavalOruroClub.webp' %}" alt="Club carnaval Oruro" width="64" height="64" onerror="this.style.display='none'">
                    <h2>Acceso al sistema</h2>
                </div>
                <form method="post" autocomplete="on" class="login-form">
                    {% csrf_token %}
                    <div class="login-field">
                        <label for="id_username" class="login-field-label">Usuario</label>
                        <div class="form-group input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                            </div>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Ingresa tu usuario" autocomplete="username" required autofocus>
                        </div>
                    </div>
                    <div class="login-field">
                        <div class="login-field-row">
                            <label for="id_password" class="login-field-label">Contrasena</label>
                            <span class="login-field-hint">Acceso seguro</span>
                        </div>
                        <div class="form-group input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            </div>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Ingresa tu contrasena" autocomplete="current-password" required>
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-secondary password-toggle-btn" id="togglePassword" aria-label="Mostrar contrasena" aria-pressed="false">
                                    <i class="fas fa-eye" id="eyeIcon" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    {% if messages %}
                        <div class="login-alerts">
                        {% for message in messages %}
                        <div class="alert alert-danger py-2 mb-2">{{ message }}</div>
                        {% endfor %}
                        </div>
                    {% endif %}
                    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
                    <div class="login-security-note">
                        <i class="fas fa-shield-alt" aria-hidden="true"></i>
                        <span>Solo personal autorizado. Tus credenciales se validan de forma segura.</span>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{% static 'js/auth/login.js' %}"></script>
</body>
</html>
