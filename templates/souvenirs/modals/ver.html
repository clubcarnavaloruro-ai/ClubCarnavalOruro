<div class="modal fade modal-ver-gestion" id="modalVerSouvenir" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-socio-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Ver souvenir</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <img id="verSouvenirImagen" class="img-fluid rounded" alt="Souvenir" style="display:none;" />
                        <div id="verSouvenirImagenPlaceholder" class="souvenir-image-placeholder">Sin imagen</div>
                    </div>
                    <div class="col-md-8">
                        <p><strong>Nombre:</strong> <span id="verSouvenirNombre"></span></p>
                        <p><strong>Evento:</strong> <span id="verSouvenirEvento"></span></p>
                        <p><strong>Descripción:</strong> <span id="verSouvenirDescripcion"></span></p>
                        <p><strong>Stock:</strong> <span id="verSouvenirStock"></span></p>
                        <p><strong>Activo:</strong> <span id="verSouvenirActivo"></span></p>
                        <p><strong>Creado:</strong> <span id="verSouvenirCreado"></span></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
