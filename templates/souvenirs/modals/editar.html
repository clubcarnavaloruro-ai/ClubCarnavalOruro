<div class="modal fade modal-editar-gestion" id="modalEditarSouvenir" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-socio-dialog" role="document">
        <div class="modal-content">
            <form id="formEditarSouvenir" method="post" enctype="multipart/form-data" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Editar souvenir</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input id="editarSouvenirNombre" type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Evento</label>
                        <select id="editarSouvenirEvento" name="evento_id" class="form-control">
                            <option value="">Sin evento</option>
                            {% for evento in eventos %}
                            <option value="{{ evento.id }}">{{ evento.nombre }} - {{ evento.fecha_evento|date:'d/m/Y' }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="editarSouvenirDescripcion" name="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Stock</label>
                            <input id="editarSouvenirStock" type="number" name="stock" class="form-control" min="0">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Imagen</label>
                            <input type="file" name="imagen" class="form-control-file" accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
